<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="家常菜单，选好菜后把点菜单发给掌勺人。"><title>开饭 · 家常菜单</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><main><header><div><p>家常菜单</p><h1>今天吃什么？</h1></div><button id="share" class="outline">分享菜单</button></header><label class="search"><span>搜索菜品</span><input id="search" placeholder="搜菜名或食材" type="search"></label><nav id="filters" aria-label="菜品分类"></nav><section id="menu" class="grid" aria-label="菜单"></section><p id="empty" hidden>没有找到菜品。</p></main><footer><span>已选 <strong id="count">0</strong> 份</span><button id="checkout" disabled>查看点单</button></footer><dialog id="recipe"></dialog><dialog id="order"><form id="orderForm"><div class="row"><h2>这顿吃什么</h2><button type="button" class="outline close">关闭</button></div><ul id="chosen"></ul><label>你的称呼<input id="name" maxlength="20" required placeholder="怎么称呼你？"></label><label>备注<textarea id="note" maxlength="120" placeholder="用餐时间、忌口等（选填）"></textarea></label><p class="hint">复制订单后，打开微信粘贴并发送给掌勺人。</p><button type="submit">复制订单</button><textarea id="copyFallback" aria-label="点单内容" readonly hidden></textarea></form></dialog><div role="status" id="status"></div></body></html>
